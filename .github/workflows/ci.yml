name: CI

# SonarCloud analysis runs separately through the SonarCloud GitHub app
# (Automatic Analysis), so it is intentionally not part of this workflow.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0 (first release with Ruby 4.0.10)
        with:
          bundler-cache: true # runs bundle install and caches gems; Ruby version from .ruby-version

      # Same checks as running bin/ci locally (see config/ci.rb).
      - name: Lint, audit and test
        run: bin/ci
