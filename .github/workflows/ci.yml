name: CI

# SonarCloud analysis runs separately through the SonarCloud GitHub app
# (Automatic Analysis), so it is intentionally not part of this workflow.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    # Pinned: setup-ruby only ships the latest 3.2.x patch for ubuntu-26.04. Revisit with the Ruby upgrade.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true # runs bundle install and caches gems; Ruby version from .ruby-version

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run tests
        run: bundle exec rspec

      - name: Rubocop
        run: bundle exec rubocop
