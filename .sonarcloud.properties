# Configuration for SonarCloud Automatic Analysis (no CI scanner step; see AGENTS.md).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Don't analyse generated or third-party code:
# - public/: stock Rails error pages (static HTML with shared inline CSS/SVG)
# - vendor/: vendored third-party libraries (see vendor/trueskill/VENDORED.md)
sonar.exclusions=public/**,vendor/**,tmp/**,log/**,coverage/**
