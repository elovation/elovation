inherit_from: .rubocop_todo.yml

AllCops:
  SuggestExtensions: false
  NewCops: disable
  Exclude:
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'db/**/*'
    - 'test/**/*'
    - 'spec/**/*'
  TargetRubyVersion: 4.0
# Rating systems are modules that `extend self` so they can keep private helpers.
Style/ModuleFunction:
  EnforcedStyle: extend_self
